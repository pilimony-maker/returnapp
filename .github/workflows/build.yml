name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libgl1-mesa-dev \
            unzip \
            zip

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade "cython<3.0.0" buildozer

      - name: Setup Android SDK Tools (Install aidl & build-tools)
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # 下載並解鎖 Android commandlinetools
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          curl -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-9441835_latest.zip
          unzip commandlinetools.zip
          mv cmdline-tools latest
          
          # 同意授權並安裝 build-tools (內含 aidl) 與 platform-tools
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platform-tools" "platforms;android-33"

      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: ${{ github.workspace }}/../android-sdk
          ANDROID_SDK_ROOT: ${{ github.workspace }}/../android-sdk
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          retention-days: 7
