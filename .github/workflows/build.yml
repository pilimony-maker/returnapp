name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Swap Space (防止記憶體不足 OOM)
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & Aidl
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libgl1-mesa-dev \
            unzip \
            zip \
            aidl \
            libltdl-dev \
            libffi-dev \
            libssl-dev
          sudo apt-get clean

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade "cython<3.0.0" buildozer

      - name: Cache Buildozer & CCache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.ccache
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build APK with Buildozer
        env:
          _JAVA_OPTIONS: "-Xmx2048m"
          MAKEFLAGS: "-j2"
          APP_ANDROID_ACCEPT_SDK_LICENSES: "1"
        run: |
          # 加上 non-interactive 與自動同意標記，避免 Broken pipe 管道破裂
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          retention-days: 7
