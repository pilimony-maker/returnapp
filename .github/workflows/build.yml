name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Swap Space (防止記憶體不足 OOM)
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ninja-build \
            ccache \
            libgl1-mesa-dev \
            unzip \
            zip
          sudo apt-get clean

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install --upgrade "cython<3.0.0" buildozer

      - name: Setup Android SDK Tools
        env:
          _JAVA_OPTIONS: "-Xmx2048m"
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          # 建立明確的 SDK 根目錄
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools

          # 下載最新的 Command Line Tools
          curl -fL --retry 3 -o commandlinetools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools.zip
          rm commandlinetools.zip

          # 修正目錄名稱以符合 SDKManager 規範
          rm -rf latest
          mv cmdline-tools latest
          
          # 同意所有授權並安裝 build-tools 與 platform-tools (確保包含 aidl)
          yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses || true
          $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk "build-tools;33.0.2" "platform-tools" "platforms;android-33"

      - name: Cache Buildozer & CCache
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.ccache
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Build APK with Buildozer
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
          _JAVA_OPTIONS: "-Xmx2048m"
          MAKEFLAGS: "-j2"
        run: |
          # 確保環境變數 PATH 能直接存取 SDK 的 build-tools
          export PATH=$ANDROID_HOME/build-tools/33.0.2:$ANDROID_HOME/platform-tools:$PATH
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          retention-days: 7
