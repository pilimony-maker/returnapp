name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
            libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
            libavformat-dev libavcodec-dev zlib1g-dev libffi-dev libssl-dev \
            cmake ninja-build autoconf automake libtool pkg-config ccache \
            zip unzip aidl libstdc++6 gfortran libltdl-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install "cython<3.0.0" "buildozer>=1.5.0" "kivy==2.3.0"

      - name: Clear Buildozer Cache
        run: |
          rm -rf ~/.buildozer/
          rm -rf .buildozer/
          mkdir -p ~/.buildozer/android/platform/

      # 核心優化：同時橋接 SDK 與 Runner 內建的 NDK，徹底杜絕外部下載 502 網路錯誤
      - name: Bridge System Android SDK and NDK to Buildozer
        run: |
          SYS_SDK="/usr/local/lib/android/sdk"
          BZ_PLATFORM="$HOME/.buildozer/android/platform"
          BZ_SDK="$BZ_PLATFORM/android-sdk"
          
          mkdir -p "$BZ_SDK"
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          # 同意授權並安裝 build-tools
          yes | $SYS_SDK/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $SYS_SDK/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33" "platform-tools"

          # 建立 SDK 橋接軟連結
          ln -s $SYS_SDK/build-tools "$BZ_SDK/build-tools"
          ln -s $SYS_SDK/platforms "$BZ_SDK/platforms"
          ln -s $SYS_SDK/platform-tools "$BZ_SDK/platform-tools"
          ln -s $SYS_SDK/cmdline-tools "$BZ_SDK/cmdline-tools"
          
          mkdir -p "$BZ_SDK/tools/bin"
          ln -sf $SYS_SDK/cmdline-tools/latest/bin/sdkmanager "$BZ_SDK/tools/bin/sdkmanager"
          
          # 強制修復系統 aidl
          sudo ln -sf /usr/bin/aidl $SYS_SDK/build-tools/33.0.2/aidl || true
          ln -sf /usr/bin/aidl "$BZ_SDK/build-tools/33.0.2/aidl" || true

          # 【抗 502 終極大招】：直接使用 GitHub 虛擬機內建的 NDK 25.x 軟連結過去，完全不下載
          # 尋找系統自帶的 ndk 25 版本路徑
          SYS_NDK_25=$(ls -d /usr/local/lib/android/sdk/ndk/25.* 2>/dev/null | head -n 1)
          if [ -z "$SYS_NDK_25" ]; then
            # 如果找不到 25，就拿系統預裝的預設 ndk 目錄
            SYS_NDK_25=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | head -n 1)
          fi
          echo "Using System NDK Path: $SYS_NDK_25"
          ln -s "$SYS_NDK_25" "$BZ_PLATFORM/android-ndk-r25c"

      - name: Build APK with Buildozer
        env:
          MAKEFLAGS: "-j1"
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
