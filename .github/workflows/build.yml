name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@v1.0
      with:
        swap-size-gb: 12

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update || sudo apt-get update --fix-missing
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          git \
          ffmpeg \
          libsdl2-dev \
          libsdl2-image-dev \
          libsdl2-mixer-dev \
          libsdl2-ttf-dev \
          libportmidi-dev \
          libswscale-dev \
          libavformat-dev \
          libavcodec-dev \
          zlib1g-dev \
          cmake \
          ninja-build \
          autoconf \
          automake \
          libtool \
          pkg-config \
          ccache \
          zip \
          unzip \
          libssl-dev \
          aidl

    - name: Install Python Dependencies & Buildozer
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" "buildozer>=1.5.0" kivy

    - name: Setup Android SDK Tools & Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

    - name: Build APK with Buildozer
      env:
        MAKEFLAGS: "-j2"
        ANDROIDSDK: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: bin/*.apk
