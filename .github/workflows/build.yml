name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@v1.0
        with:
          swap-size-gb: 12

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ffmpeg \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libportmidi-dev \
            libswscale-dev \
            libavformat-dev \
            libavcodec-dev \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            cmake \
            ninja-build \
            autoconf \
            automake \
            libtool \
            pkg-config \
            ccache \
            zip \
            unzip

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          pip install \
            "cython<3.0.0" \
            "buildozer>=1.5.0" \
            "kivy==2.3.0"

      - name: Clean Buildozer Cache
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Initialize Buildozer Android Environment
        run: |
          buildozer -v android update

      - name: Find Android SDK
        run: |
          echo "=== Buildozer Android directory ==="
          find "$HOME/.buildozer/android" -maxdepth 4 -type d -print || true

          echo "=== sdkmanager ==="
          find "$HOME/.buildozer/android" -type f -name sdkmanager -print || true

      - name: Setup Android SDK
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          echo "SDK_DIR=$SDK_DIR"

          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_DIR/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/bin/sdkmanager"
          elif [ -x "$SDK_DIR/tools/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/tools/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager not found"
            find "$HOME/.buildozer/android" -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            --licenses || true

          "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Verify AIDL
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          AIDL="$SDK_DIR/build-tools/33.0.2/aidl"

          echo "=== Build Tools ==="
          ls -la "$SDK_DIR/build-tools/33.0.2/" || true

          echo "=== Search AIDL ==="
          find "$SDK_DIR" -type f -name aidl -print || true

          if [ ! -f "$AIDL" ]; then
            echo "ERROR: AIDL not found"
            exit 1
          fi

          chmod +x "$AIDL"

          echo "AIDL found:"
          ls -lh "$AIDL"

          echo "AIDL version:"
          "$AIDL" --version || true

      - name: Build APK with Buildozer
        env:
          MAKEFLAGS: "-j2"
          ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        run: |
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: bin/*.apk
          if-no-files-found: error
